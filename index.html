<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chrono Arcade</title>
<meta name="description" content="History games about when and where things happened: Decade Drop, Where and When, and Closer Than You Think.">
<meta name="theme-color" content="#eceeee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chrono">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a phone app shell. Nav bar on top, one scrolling screen, an action dock and tab bar pinned to the bottom. Time is drawn as rock strata: each era has its own layer color. */
:root{
  --bg:#eceeee; --panel:#ffffff; --panel-2:#f5f6f6; --ink:#15191d; --muted:#5b646b; --line:#dfe3e5; --line-strong:#c3cacd;
  --accent:#2c4a8f; --accent-ink:#ffffff; --accent-soft:#e1e7f4;
  --ancient:#b9822f; --medieval:#7b5aa6; --early:#2c7a6b; --modern:#2c4a8f;
  --ancient-soft:#f3e6cf; --medieval-soft:#e9e1f3; --early-soft:#d9ece7; --modern-soft:#dde4f3;
  --good:#23824a; --good-soft:#d8efe0; --bad:#b8324f; --bad-soft:#f6dbe1;
  --water:#cbdbe3; --land:#e6e5df; --land-stroke:#ffffff; --grat:#bccfd9;
  --bar:rgba(236,238,238,.86); --scrim:rgba(10,14,18,.38);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1316; --panel:#192126; --panel-2:#1f292f; --ink:#e7ecee; --muted:#97a3aa; --line:#26313a; --line-strong:#3a4852;
  --accent:#8fb0ff; --accent-ink:#0b1430; --accent-soft:#1d2a47;
  --ancient:#e0aa55; --medieval:#b597e0; --early:#5cc0a9; --modern:#8fb0ff;
  --ancient-soft:#3a2d17; --medieval-soft:#2d2440; --early-soft:#173530; --modern-soft:#1d2a47;
  --good:#5fd08b; --good-soft:#173a26; --bad:#ff8aa3; --bad-soft:#40202a;
  --water:#13303f; --land:#2b353a; --land-stroke:#0f1316; --grat:#1d4155;
  --bar:rgba(15,19,22,.86); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1316; --panel:#192126; --panel-2:#1f292f; --ink:#e7ecee; --muted:#97a3aa; --line:#26313a; --line-strong:#3a4852;
  --accent:#8fb0ff; --accent-ink:#0b1430; --accent-soft:#1d2a47;
  --ancient:#e0aa55; --medieval:#b597e0; --early:#5cc0a9; --modern:#8fb0ff;
  --ancient-soft:#3a2d17; --medieval-soft:#2d2440; --early-soft:#173530; --modern-soft:#1d2a47;
  --good:#5fd08b; --good-soft:#173a26; --bad:#ff8aa3; --bad-soft:#40202a;
  --water:#13303f; --land:#2b353a; --land-stroke:#0f1316; --grat:#1d4155;
  --bar:rgba(15,19,22,.86); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.press{transition:transform .12s ease,background-color .15s,border-color .15s}
.press:active{transform:scale(.97)}

/* Shell */
.shell{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:600px){.shell{border-inline:1px solid var(--line)}}
.nav{flex:none;padding:calc(var(--st) + 6px) max(10px,var(--sr)) 6px max(10px,var(--sl));display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;min-height:calc(var(--st) + 50px);background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;z-index:3}
.nav.edge{border-bottom-color:var(--line)}
.nav .title{text-align:center;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:17px;display:inline-flex;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;min-height:40px}
.navbtn svg{width:26px;height:26px}
.navbtn.right{justify-self:end}
.navbtn.round{width:34px;height:34px;min-height:0;justify-content:center;border-radius:50%;background:var(--accent-soft);font-family:var(--display);font-size:18px;padding:0}
.progress{flex:none;display:flex;gap:4px;padding:0 max(16px,var(--sr)) 8px max(16px,var(--sl));background:var(--bar)}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)} .progress i.ok{background:var(--good)} .progress i.no{background:var(--bad)}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px max(16px,var(--sr)) 20px max(16px,var(--sl));display:flex;flex-direction:column;gap:14px}
.content.fill{overflow:hidden;padding:0;gap:0}
.content > *{flex-shrink:0}
.content.fill > *{flex-shrink:1}
.dock{flex:none;grid-template-columns:minmax(0,1fr);background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:10px max(16px,var(--sr)) calc(10px + var(--sb)) max(16px,var(--sl));display:grid;gap:10px;z-index:3}
.dock.has-tabs{padding-bottom:10px}
.tabs{flex:none;display:grid;grid-template-columns:1fr 1fr;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:6px max(16px,var(--sr)) calc(4px + var(--sb)) max(16px,var(--sl));z-index:3}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}

/* Type */
.large{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.01em;margin:4px 0 0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.yr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.section-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 4px -6px}

/* Controls */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:7px 0;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:700;font-size:17px;background:var(--accent);color:var(--accent-ink);width:100%}
.btn:disabled{opacity:.38}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.done{background:var(--good-soft);color:var(--good)}

/* Home */
.today{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.streak{display:grid;justify-items:center;background:var(--panel);border-radius:14px;padding:8px 12px;min-width:68px}
.streak b{font-family:var(--mono);font-size:22px;line-height:1}
.streak span{font-size:11px;font-weight:600;color:var(--muted)}
.strata{display:flex;height:8px;border-radius:4px;overflow:hidden}
.group{background:var(--panel);border-radius:16px;overflow:hidden}
.mrow{width:100%;border:0;background:none;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 14px 14px 14px}
.mrow + .mrow{border-top:1px solid var(--line)}
.mrow:active{background:var(--panel-2)}
.micon{width:52px;height:52px;border-radius:13px;display:grid;place-items:center}
.micon svg{width:28px;height:28px}
.mrow h3{margin:0;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.mrow p{margin:2px 0 6px;color:var(--muted);font-size:14px;line-height:1.3}
.chev{color:var(--line-strong);width:18px;height:18px}
.fact{background:var(--panel);border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.fact p{margin:0;font-size:15px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border-radius:14px;padding:12px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:22px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.week div{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted);font-weight:600}
.week i{width:100%;aspect-ratio:1;border-radius:9px;background:var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink)}
.week i.d1{background:var(--early-soft)} .week i.d2{background:var(--early);color:var(--accent-ink)} .week i.d3{background:var(--good);color:#fff}

/* Prompt card */
.prompt{display:grid;gap:4px}
.prompt .t{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.15;text-wrap:balance}
.hint{font-size:14px;color:var(--muted);margin:0}

/* Decade Drop */
.deck{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 18px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.deck .cat{color:inherit;opacity:.7}
.deck .t{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15;text-wrap:balance}
.deck .ask{font-size:14px;opacity:.8}
.deck.fresh{animation:dealin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes dealin{from{transform:translateY(-10px) scale(.97);opacity:.3}to{transform:none;opacity:1}}
.deck.idle{background:var(--panel);color:var(--ink);box-shadow:none}
.bins{display:grid;gap:8px}
.binrow{width:100%;text-align:left;border:2px solid transparent;border-radius:14px;padding:12px 14px 12px 12px;display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:4px 12px;align-items:center;min-height:58px;background:var(--panel)}
.binrow .stripe{grid-row:1/span 2;align-self:stretch;border-radius:4px}
.binrow .lbl{font-family:var(--mono);font-weight:700;font-size:17px}
.binrow .drop{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.binrow .chips{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}
.binrow .chips:empty{display:none}
.binrow.target{border-color:var(--accent)}
.binrow{cursor:pointer}.binrow[aria-disabled="true"]{cursor:default}.binrow[aria-disabled="true"]:active{transform:none}
.pchip{border:0;font:inherit;font-size:13px;font-weight:600;line-height:1.2;text-align:left;padding:6px 10px;border-radius:10px;background:var(--panel-2);color:var(--ink);max-width:100%}
.pchip.ok{background:var(--good-soft);color:var(--good)} .pchip.no{background:var(--bad-soft);color:var(--bad)}

/* Map */
.mapwrap{position:relative;flex:1;min-height:0;background:var(--water);touch-action:none;overflow:hidden}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sphere{fill:var(--water)} .grat{fill:none;stroke:var(--grat);stroke-width:.5;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--land-stroke);stroke-width:.6;vector-effect:non-scaling-stroke}
.mapcard{position:absolute;left:max(12px,var(--sl));right:max(12px,var(--sr));top:12px;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:grid;gap:2px;z-index:2}
.mapcard .t{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;text-wrap:balance}
.zoomctl{position:absolute;right:max(12px,var(--sr));bottom:12px;display:grid;background:var(--panel);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);overflow:hidden;z-index:2}
.zoomctl button{width:44px;height:44px;border:0;background:none;font-size:22px;font-weight:600;color:var(--ink)}
.zoomctl button + button{border-top:1px solid var(--line)}
.maptag{position:absolute;left:12px;bottom:12px;font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);padding:3px 8px;border-radius:8px;z-index:2}
.tapme{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;z-index:2;pointer-events:none;white-space:nowrap}
.yearctl{display:grid;gap:8px;min-width:0;grid-template-columns:minmax(0,1fr)}
.yearread{display:flex;align-items:center;gap:10px}
.yearread input{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:26px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);-webkit-user-select:text;user-select:text}
.era{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0;height:28px}
.nudges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.nudges button{border:0;background:var(--panel);border-radius:10px;min-height:38px;font-family:var(--mono);font-weight:700;font-size:13px}
.res2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res2 div{background:var(--panel-2);border-radius:12px;padding:10px 12px}
.res2 b{display:block;font-family:var(--mono);font-size:22px}
.res2 span{font-size:13px;color:var(--muted)}

/* Closer */
.anchor{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px 18px;display:grid;gap:4px}
.anchor .cat{color:inherit;opacity:.7}
.anchor .t{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.15}
.vs{text-align:center;font-size:14px;font-weight:700;color:var(--muted)}
.choice{width:100%;text-align:left;border:2px solid transparent;background:var(--panel);border-radius:16px;padding:16px;display:grid;gap:4px;font-weight:600;font-size:17px;line-height:1.25;min-height:84px;align-content:center}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{color:var(--ink);cursor:default}
.tl{background:var(--panel);border-radius:16px;padding:12px}
.tl svg{width:100%;height:auto;display:block;overflow:visible}
.tl text{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.tl .lbl{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink)}
.note{margin:0;font-size:15px}
.note.m{color:var(--muted)}

/* Sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:8}
.scrim.on{opacity:1}
.scrim:not(.on){pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:9;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line-strong);margin:8px auto 2px;flex:none}
.sheet .body{overflow-y:auto;padding:8px max(18px,var(--sr)) 14px max(18px,var(--sl));display:grid;gap:14px}
.sheet .foot{padding:10px max(18px,var(--sr)) calc(12px + var(--sb)) max(18px,var(--sl));display:grid;gap:10px;border-top:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.1}
.big{font-family:var(--mono);font-weight:700;font-size:46px;line-height:1}
.grid-emoji{font-size:22px;letter-spacing:3px;overflow-wrap:anywhere}
.rules{margin:0;padding-left:20px;display:grid;gap:8px;font-size:16px}
.list{display:grid;margin:0;padding:0;list-style:none;background:var(--panel);border-radius:14px;overflow:hidden}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 14px;align-items:baseline}
.list li + li{border-top:1px solid var(--line)}
.list li p{grid-column:2;margin:0;font-size:13px;color:var(--muted)}
.loading{margin:auto;color:var(--muted)}
.screen-in{animation:slidein .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="nav" id="nav">
    <span id="navL"></span><span class="title" id="navT">Chrono Arcade</span><span id="navR" style="justify-self:end"></span>
  </header>
  <div class="progress" id="prog" hidden></div>
  <main class="content" id="content"><p class="loading">Loading events…</p></main>
  <div class="dock" id="dock" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button class="tab" data-tab="" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Play</button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Stats</button>
  </nav>
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grab"></div><div class="body" id="sheetBody"></div><div class="foot" id="sheetFoot"></div></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
"use strict";
const NOW = 2026;
const $ = (s, r = document) => r.querySelector(s);
const content = $("#content"), dock = $("#dock"), tabs = $("#tabs"), prog = $("#prog");
let EVENTS = [], WORLD = null, mode = "daily";
try { mode = localStorage.getItem("chrono-mode") || "daily"; } catch {}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtYear = (y, ca) => (ca ? "c. " : "") + (y < 0 ? `${-y} BCE` : y < 1000 ? `${y} CE` : `${y}`);
function era(y) {
  if (y < 500) return { k: "ancient", n: "Ancient" };
  if (y < 1500) return { k: "medieval", n: "Medieval" };
  if (y < 1800) return { k: "early", n: "Early modern" };
  return { k: "modern", n: "Modern" };
}
const CAT = { invention: "Invention", everyday: "Everyday life", empire: "Empires", nation: "Nations", conflict: "Conflict", exploration: "Exploration", trade: "Trade routes", science: "Science", culture: "Culture", religion: "Religion" };

  let t = d3.zoomIdentity, guess = null, truth = null, locked = false;
  const zoom = d3.zoom().scaleExtent([1, 18]).translateExtent([[sb[0][0], sb[0][1] - H * 0.15], [sb[1][0], sb[1][1] + H * 0.1]])

  svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H * 0.55).scale(k0).translate(-c0[0], -c0[1]));
  svg.on("click", ev => {

}
function playWhere() {
  if (!startGame("where")) return;
  const r = rngFrom(seedFor("where")), R = makeWhereRound(r);
  let i = 0, total = 0; const log = [];
  function round() {
    const e = R[i]; let ll = null, year = 1500;
    setProgress(R.map((_, j) => (j < i ? (log[j].pts >= 500 ? "ok" : "no") : j === i ? "on" : "")));
    screen("fill");
    content.innerHTML = `<div class="mapwrap" id="map">
        <div class="mapcard"><span class="cat">${CAT[e.c]} · ${i + 1} of 5 · ${total.toLocaleString()} pts</span><span class="t">${esc(e.t)}</span></div>
        <div class="tapme" id="tapme">Tap where it happened</div>
        <div class="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
        <span class="maptag">Modern borders</span></div>`;
    setDock(`<div class="yearctl">
        <div class="yearread"><input id="yin" inputmode="text" enterkeyhint="done" value="1500" aria-label="Year. Type 1450 or 300 BCE"><span class="era" id="era"></span></div>
        <input type="range" id="yr" min="0" max="${S_MAX}" step="1" aria-label="Year slider, oldest on the left">
        <div class="nudges">${[-100, -10, -1, 1, 10, 100].map(n => `<button class="press" data-n="${n}">${n > 0 ? "+" : "−"}${Math.abs(n)}</button>`).join("")}</div>
      </div><button class="btn press" id="go" disabled>Drop a pin first</button>`);
    const map = buildMap($("#map"), p => { ll = p; $("#tapme").hidden = true; upd(); });
    $("#zin").onclick = ev => { ev.stopPropagation(); buzz(); map.zoomBy(1.8); };
    $("#zout").onclick = ev => { ev.stopPropagation(); buzz(); map.zoomBy(1 / 1.8); };
    const yin = $("#yin"), yr = $("#yr"), go = $("#go"), eraEl = $("#era");
    function setYear(y, from) {
      year = Math.max(YMIN, Math.min(NOW, y)); if (year === 0) year = 1;
      if (from !== "text") yin.value = year < 0 ? `${-year} BCE` : `${year}`;
      if (from !== "range") yr.value = sFromYear(year);
      const er = era(year); eraEl.textContent = er.n; eraEl.style.background = `var(--${er.k}-soft)`; eraEl.style.color = `var(--${er.k})`;
    }
    const upd = () => { go.disabled = !ll; go.textContent = ll ? `Lock in ${fmtYear(year)}` : "Drop a pin first"; };
    yr.oninput = () => { setYear(yearFromS(+yr.value), "range"); upd(); };
    yin.oninput = () => { const y = parseYear(yin.value); if (y !== null) { setYear(y, "text"); upd(); } };
    yin.onblur = () => setYear(year);
    yin.onkeydown = ev => { if (ev.key === "Enter") yin.blur(); };
    dock.querySelectorAll("[data-n]").forEach(b => (b.onclick = () => { buzz(); let y = year + +b.dataset.n; if (year > 0 && y <= 0) y -= 1; if (year < 0 && y >= 0) y += 1; setYear(y); upd(); }));
    setYear(1500); upd();
    go.onclick = () => {
      const km = Math.round(d3.geoDistance(ll, [e.lo, e.la]) * 6371), dp = distPts(km), tp = timePts(year, e.y), off = Math.abs(year - e.y);
      total += dp + tp; log.push({ e, km, off, pts: dp + tp }); buzz(15);
      map.reveal([e.lo, e.la]);
      setProgress(R.map((_, j) => (j <= i ? (log[j].pts >= 500 ? "ok" : "no") : "")));
      setDock(`<div style="display:grid;gap:4px"><span class="eyebrow"><span class="yr">${fmtYear(e.y, e.ca)}</span> · ${esc(e.p)}</span><p class="note">${esc(e.f)}</p></div>
        <div class="res2"><div><b>${dp}</b><span>Place · ${km.toLocaleString()} km off</span></div><div><b>${tp}</b><span>Year · ${off === 0 ? "exact" : off.toLocaleString() + " yrs off"}</span></div></div>
        <button class="btn press" id="nx">${i < 4 ? "Next event" : "See results"}</button>`);
      $("#nx").onclick = () => {
        buzz();
        if (++i < 5) return round();
        finish("where", total, log.map(l => `<li><span class="yr">${l.pts}</span><span>${esc(l.e.t)}</span><p>${fmtYear(l.e.y, l.e.ca)}, ${esc(l.e.p)}. ${l.km.toLocaleString()} km and ${l.off.toLocaleString()} years off.</p></li>`).join(""),
          log.map(l => (l.pts >= 800 ? "🟩" : l.pts >= 500 ? "🟨" : l.pts >= 250 ? "🟧" : "🟥")).join(""));

}

/* ---------- Closer Than You Think ---------- */
function makeCloserRound(r) {
  const used = new Set(), surprising = [], plain = [];
  for (let tries = 0; tries < 6000 && (surprising.length < 7 || plain.length < 3); tries++) {
    const x = pick(EVENTS, r), a = pick(EVENTS, r), b = pick(EVENTS, r);
    if (new Set([x.id, a.id, b.id]).size < 3 || [x, a, b].some(e => used.has(e.id))) continue;
    const da = Math.abs(a.y - x.y), db = Math.abs(b.y - x.y), near = da < db ? a : b, far = da < db ? b : a, dn = Math.min(da, db), df = Math.max(da, db);
    if (dn < 15 || df / dn < 1.3 || df - dn < 15) continue;
    const ex = era(x.y).k, isS = era(far.y).k === ex && era(near.y).k !== ex, bucket = isS ? surprising : plain;
    if (bucket.length >= (isS ? 7 : 3)) continue;
    bucket.push({ x, a, b, near, far, dn, df }); [x, a, b].forEach(e => used.add(e.id));
  }
  return shuffle(surprising.concat(plain), r).slice(0, 10);
}
function tlSvg(q) {
  const es = [q.x, q.a, q.b].sort((m, n) => m.y - n.y), W = 340, pad = 14;
  const xs = d3.scaleLinear().domain(d3.extent(es, e => e.y)).range([pad, W - pad]);
  const col = e => (e === q.x ? "var(--ink)" : e === q.near ? "var(--good)" : "var(--bad)");
  const mid = (m, n) => (xs(m.y) + xs(n.y)) / 2;
  return `<svg viewBox="0 0 ${W} 96" role="img" aria-label="The three events drawn to scale">
    <line x1="${pad}" x2="${W - pad}" y1="48" y2="48" stroke="var(--line-strong)" stroke-width="3" stroke-linecap="round"/>
    <line x1="${xs(q.x.y)}" x2="${xs(q.near.y)}" y1="48" y2="48" stroke="var(--good)" stroke-width="6" stroke-linecap="round"/>
    <text x="${mid(q.x, q.near)}" y="36" text-anchor="middle">${q.dn.toLocaleString()} yrs</text>
    <text x="${mid(q.x, q.far)}" y="68" text-anchor="middle">${q.df.toLocaleString()} yrs</text>
    ${es.map((e, j) => `<circle cx="${xs(e.y)}" cy="48" r="8" fill="${col(e)}" stroke="var(--panel)" stroke-width="2.5"/><text x="${xs(e.y)}" y="${j % 2 ? 92 : 13}" text-anchor="${j === 0 ? "start" : j === 2 ? "end" : "middle"}" class="lbl">${fmtYear(e.y, e.ca)}</text>`).join("")}
  </svg>`;
}
function playCloser() {
  if (!startGame("closer")) return;
  const r = rngFrom(seedFor("closer")), R = makeCloserRound(r);
  let i = 0, score = 0; const res = [];
  function round() {
    const q = R[i];
    setProgress(R.map((_, j) => (j < i ? (res[j] ? "ok" : "no") : j === i ? "on" : "")));
    screen(); setDock(null);
    content.innerHTML = `<span class="eyebrow">${mode === "daily" ? "Daily" : "Practice"} · ${i + 1} of ${R.length} · ${score} right</span>
      <div class="anchor"><span class="cat">${CAT[q.x.c]}</span><span class="t">${esc(q.x.t)}</span></div>
      <div class="vs">Which happened closer in time to this?</div>
      ${[q.a, q.b].map((e, j) => `<button class="choice press" data-j="${j}"><span class="cat">${CAT[e.c]}</span>${esc(e.t)}</button>`).join("")}
      <div id="ans" style="display:grid;gap:10px"></div>`;
    content.querySelectorAll(".choice").forEach(btn => (btn.onclick = () => {
      const chosen = btn.dataset.j === "0" ? q.a : q.b, ok = chosen === q.near;
      if (ok) score++; res.push(ok); buzz(ok ? 12 : [20, 40, 20]);
      setProgress(R.map((_, j) => (j <= i ? (res[j] ? "ok" : "no") : "")));
      content.querySelectorAll(".choice").forEach(c => { const e = c.dataset.j === "0" ? q.a : q.b; c.disabled = true; c.classList.add(e === q.near ? "ok" : "no"); c.insertAdjacentHTML("beforeend", `<span class="yr" style="font-size:14px">${fmtYear(e.y, e.ca)}</span>`); });
      content.querySelector(".anchor").insertAdjacentHTML("beforeend", `<span class="yr" style="font-size:14px">${fmtYear(q.x.y, q.x.ca)}</span>`);
      const fe = q.near.f ? q.near : q.x;
      $("#ans").innerHTML = `<div class="tl">${tlSvg(q)}</div><p class="note"><b>${ok ? "Right." : "Not quite."}</b> ${q.dn.toLocaleString()} years versus ${q.df.toLocaleString()}.</p><p class="note m"><b>${esc(fe.t)}:</b> ${esc(fe.f)}</p>`;
      setDock(`<button class="btn press" id="nx">${i < R.length - 1 ? "Next" : "See results"}</button>`);
      $("#ans").scrollIntoView({ behavior: "smooth", block: "nearest" });
      $("#nx").onclick = () => {
        buzz();

        finish("closer", score, R.map((qq, j) => `<li><span>${res[j] ? "✓" : "✗"}</span><span>${esc(qq.x.t)} → ${esc(qq.near.t)}</span><p>${qq.dn.toLocaleString()} vs ${qq.df.toLocaleString()} years</p></li>`).join(""), res.map(x => (x ? "🟩" : "🟥")).join(""));
      };
